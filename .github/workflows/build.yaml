name: Build and Deploy

on:
  push:
    branches:
      - '**'    # all branches
  pull_request:
    types: [closed]

concurrency:
  group: deploy-to-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v3
      - run: echo "✅ Repository checked out"

      - name: Install pnpm
        run: npm install -g pnpm

      # 2️⃣ Setup Node
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: echo "✅ Node.js set up"

      # 3️⃣ Cache pnpm store
      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: echo "✅ pnpm cache restored"

      # 4️⃣ Install dependencies with pnpm
      - run: pnpm install --frozen-lockfile --production
      - run: echo "✅ Dependencies installed"

      # 5️⃣ Main build
      - run: npm run build
      - run: echo "✅ Build complete"

      # 6️⃣ Copy build into folder and commit silently
      # Instead of copying
      - name: Commit build folder silently
        run: |
          git add "^~^ website"
          git commit --allow-empty -m "AutoBuild: update site"
          git push origin HEAD
      - run: echo "✅ Build folder committed silently"

      # 7️⃣ Deploy to Nekoweb (only on main)
      # - if: github.ref == 'refs/heads/main'
        # uses: mp-pinheiro/nekoweb-deploy@main
        # with:
        #   API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
        #   BUILD_DIR: '^~^ website'
          # DEPLOY_DIR: '/'
        #   CLEANUP: 'False'
        #   DELAY: '0.5'
        #   NEKOWEB_PAGENAME: 'your-page-name'
        #   ENCRYPTION_KEY: ${{ secrets.NEKOWEB_ENCRYPTION_KEY }}
      - if: github.ref == 'refs/heads/main'
        run: echo "✅ Deployed to Nekoweb"

      # 8️⃣ Neocities build and deploy (only on main)
      # - if: github.ref == 'refs/heads/main'
      #   run: |
      #     echo "🔹 Running buildneo for Neocities"
      #     npm run buildneo
      # - if: github.ref == 'refs/heads/main'
      #   uses: bcomnes/deploy-to-neocities@v3
      #   with:
      #     api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
      #     dist_dir: "^~^ website-neo"
      #     cleanup: false
      #     neocities_supporter: false
      #     preview_before_deploy: true
      - if: github.ref == 'refs/heads/main'
        run: echo "✅ Deployed to Neocities"
