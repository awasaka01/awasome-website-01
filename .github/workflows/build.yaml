name: Build and Deploy :3

on:
  push: {}
  pull_request: { types: ["closed"] }
  workflow_dispatch: {} 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # ───────────────────────────────────────────────
      #  🛈  Checkout, Install dependencies, Build
      # ───────────────────────────────────────────────
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { cache: "pnpm", node-version: "20" }
      - run: pnpm install --prod --frozen-lockfile

      - run: pnpm run build --production

      # ───────────────────────────────────────────────
      #  🛈  Add build folder to commit
      # ───────────────────────────────────────────────
      - run: |
          git config user.name "rawr!"
          git config user.email "rawr@users.noreply.github.com"

          # force add ignored build folder
          git add -f "^~^ website"

          # amend last commit message
          GIT_COMMIT_MSG="$(git log -1 --pretty=%B)"
          git commit --amend -m "${GIT_COMMIT_MSG}" || echo "No changes to commit"

          # push to current branch safely
          git push origin HEAD --force-with-lease

      # ───────────────────────────────────────────────
      #  🛈  Deploy to Nekoweb (only on main)
      # ───────────────────────────────────────────────
      # - name: Deploy to Nekoweb
      #   if: github.ref == 'refs/heads/main'
      #   uses: mp-pinheiro/nekoweb-deploy@main
      #   with: {
      #     API_KEY: "${{ secrets.NEKOWEB_API_KEY }}",
      #     BUILD_DIR: "^~^ website",
      #     DEPLOY_DIR: "/",
      #     CLEANUP: "False",
      #     DELAY: "0.5",
      #     NEKOWEB_PAGENAME: "fairfruit",
      #     ENCRYPTION_KEY: "${{ secrets.NEKOWEB_ENCRYPTION_KEY }}"
      #   }

      # ───────────────────────────────────────────────
      #  🛈  Deploy to Neocities (only on main)
      # ───────────────────────────────────────────────
      - if: github.ref == 'refs/heads/main'
        run: pnpm run build --production --neocities

