name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]

concurrency:
  group: deploy-to-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v3
      - run: echo "✅ Repository checked out"

      # Setup Node
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: echo "✅ Node.js set up"

      # Cache npm modules
      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-cache
          restore-keys: npm-cache
      - run: echo "✅ npm cache restored"

      # Install dependencies
      - run: npm ci
      - run: echo "✅ Dependencies installed"

      # Main build
      - run: npm run build
      - run: echo "✅ Build complete"

      # Copy build into folder and commit silently
      - name: Copy build folder and commit
        run: |
          echo "🔹 Copying build into folder '^~^ website'"
          mkdir -p "^~^ website"
          cp -r "^~^ website/." "^~^ website/"
          git add "^~^ website"
          git commit --allow-empty -m "AutoBuild: update site"
          git push origin HEAD
      - run: echo "✅ Build folder committed silently"

