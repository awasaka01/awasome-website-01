name: Build and Deploy

on:
  push:
    branches: ["**"]  # run on all branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --prod --frozen-lockfile

      # -------------------------
      # Build site
      # -------------------------
      - name: Build site
        run: pnpm run build

      - name: ✅ Build complete
        run: echo "✅ Build complete"

      # -------------------------
      # Add build folder to repo
      # -------------------------
      - name: Add build folder to commit
        run: |
          git config user.name "rawr!"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # force add ignored build folder
          git add -f "^~^ website"

          # amend last commit message
          GIT_COMMIT_MSG="$(git log -1 --pretty=%B)"
          git commit --amend -m "${GIT_COMMIT_MSG} + AutoBuild" || echo "No changes to commit"

          # push to current branch safely
          git push origin HEAD --force-with-lease

