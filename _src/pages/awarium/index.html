title: "awarium"
excludeFromNeocities: true
---
<!DOCTYPE html><html lang="en"><head>

	{{ include "head.html" }}

</head><body>
	<br>
	<a href="/">Home</a>
	<label for="theme-select">Theme: </label>{{ include "theme-select.html" }}
	{{ include "theme-script.html" }}
	<br><br>

	<main>
	
		<button id="pause">
			<span>Pause</span>
			<span>Resume</span>
		</button>

		<!-- Create n amount of layers -->
		<div id="layers">
			{{ for i of 10 }}<canvas width="100" height="100"></canvas>{{ /for }}
		</div>


		<br>
		<div>FPS: <output id="fps"></output></div>
		<div>TPS: <output id="tps"></output></div>
		<br>
		<div id="step-performance"></div>
		<div>total: <output id="total">0</output>ms</div>
		<br>
		<p>60 FPS is 16.6 mspt | 30 FPS is 33.3 mspt</p>
	</main>

</body></html>
