<!DOCTYPE html>
<html lang="en">
<head>
	{{ if !addFeatures }}{{ set addFeatures = [] }}{{ /if }}

	<!-- Meta -->
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="author" content="awasaka01" />
	<meta name="description" content="{{> description ?? 'silly little website' }}">


	<!-- Display -->
	<title>{{> title ?? "default title haha" }}</title>
	<link rel="icon" href="{{> favicon ?? '/assets/images/favicon.ico' }}" type="image/gif" />


	<!-- Local CSS and JS -->
	<script type="module" src="main.js"></script>
	<link rel="stylesheet" href="main.scss">


	<!-- [?] chroma.js - Color Helper [https://gka.github.io/chroma.js/] -->
	<!-- How to use: Add <import chroma from "chroma-js"> to your file-->
	<!-- For autocompletion: Install the module's types locally (@types/chroma-js) Add /// <reference types="chroma-js"/> to the top of your file -->
	<script type="importmap">{ "imports": { 
		"chroma": "https://unpkg.com/chroma-js@3.1.2/index.js",
		"react": "https://unpkg.com/react@18.2.0/umd/react.production.min.js",
		"react-dom/client": "https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"
	} }</script>


	<!-- GSAP - Animation Library [https://gsap.com/docs/] -->
	{{ if addFeatures.includes("gsap") }}<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>{{ /if }}


	<script> // <!-- Load Theme from LocalStorage -->
		const theme = localStorage.getItem("theme");
		if (theme) { document.documentElement.setAttribute("data-theme", theme); }
	</script>


	{{ head }} <!-- additional <head> content placed here -->
</head>
<body>
	<noscript><h1 style="background-color: #680000; color: #fff;"><b><u>JavaScript is very required to use this site!!!</u></b></h1></noscript>
	{{ content }} <!-- rest of the page placed here -->




	<!-- Theme selector handling, does not include the dropdown itself -->
	<script>
		const dropdown = document.querySelector("#theme-select");
		if (!dropdown) { return; }
		const dropdownValueDisplay = dropdown.querySelector("output");
		const values = [...dropdown.querySelector("ul").children];
		if (theme) {
			const result = values.find((li) => li.dataset.id === theme)?.textContent
			if (!result) { localStorage.removeItem("theme"); document.documentElement.setAttribute("data-theme", "default"); }
			dropdownValueDisplay.value = result ?? "Default"; 
		}

		values.forEach((li) => {
			li.addEventListener("mousedown", (e) => {
				localStorage.setItem("theme", li.dataset.id);
				document.documentElement.setAttribute("data-theme", li.dataset.id);
				dropdownValueDisplay.value = li.textContent;
			});
		});
	</script>
</body>
</html>
